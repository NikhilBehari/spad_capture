# The interpreter only: every other dependency is declared once, in
# pyproject.toml, and installed by pip.
#
#   conda env create -f environment.yml
#   conda activate spad_capture
#   pip install -e '.[rgb]'                     # Linux, camera included
#   conda install -c conda-forge pyrealsense2   # macOS, the only source there
name: spad_capture
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
