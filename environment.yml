# The interpreter only: every other dependency is declared once, in
# pyproject.toml, and installed by pip. ./install.sh builds the env from this
# file and installs the rest; nodefaults keeps the Anaconda channel (and its
# terms-of-service prompt) out of the solve.
name: spad_capture
channels: [conda-forge, nodefaults]
dependencies:
  - python=3.11
  - pip
