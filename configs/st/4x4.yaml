# 4x4 mode, explicit. 16 zones at the native 37.53 mm bin (bf=1).
# At 4x4 the CNH budget caps num_bins at 75; this 0..1295 mm window is
# 35 bins: 16*35*5 + 16*5 + 28 = 2908 bytes, inside the 6160-byte limit.

name: "4x4"

sensor:
  mode: "4x4"
  start_mm: 0.0
  end_mm: 1295.0           # bin 37.53 mm (bf=1) -> 35 bins
  bin_mm: 37.5348          # request native resolution (bf=1)

capture:
  mode: "stream"
  num_frames: 20

storage:
  format: "npz"
