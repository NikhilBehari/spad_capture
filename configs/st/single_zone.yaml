# Single output zone. Restricting capture to one zone frees the whole on-device
# CNH budget for it, so num_bins can reach 255 (the uint8 cap) -- ~4.8 m of range
# at the native 37.53 mm bin, the finest depth resolution this sensor offers.
# zone is [row, col], 0-indexed in the sensor grid (8x8 -> 0..7); here [3, 4].
# Budget: 1 zone * 255 bins -> ~1.3 KB, far inside the 6160-byte cap.

backend: st

name: "single_zone"

sensor:
  mode: "8x8"
  start_mm: 0.0
  end_mm: 9571.4           # / 37.53 -> 255 bins (the max), ~9.57 m
  bin_mm: 37.5348          # native bin (bf=1): full temporal resolution
  ranging_frequency_hz: 15  # one zone is light to transfer -> hits the rate
  zone: [3, 4]            # single output zone [row, col]; null = full grid

capture:
  mode: "stream"
  num_frames: 10

storage:
  format: "npz"
